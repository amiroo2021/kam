[project]
name = "goldenfibo"
version = "0.2.0"
description = "Unified deterministic GoldenFibo engine + live visualization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
goldenfibo-web = "goldenfibo.api.app:main"

[tool.setuptools.packages.find]
include = ["goldenfibo*"]
exclude = ["reference*", "tests*"]

[tool.setuptools.package-data]
goldenfibo = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

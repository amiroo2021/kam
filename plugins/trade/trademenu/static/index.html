<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradeMenu</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar sticky-top">
      <div class="brand">TradeMenu</div>
      <div id="actionToast" class="toast" hidden></div>
      <form method="post" action="/logout"><button type="submit">Logout</button></form>
    </header>

    <section class="controls sticky-controls">
      <label>Exchange
        <select id="exchange"></select>
      </label>
      <label>Account
        <select id="account"></select>
      </label>
      <label>Symbol
        <input id="symbol" value="BTCUSD" list="symbolSuggestions" />
        <datalist id="symbolSuggestions"></datalist>
      </label>
      <label>TF
        <select id="tf">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m" selected>15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
          <option value="1D">1D</option>
        </select>
      </label>
      <label>&nbsp;<button type="button" id="reloadBtn">Reload all</button></label>
    </section>

    <div class="main">
      <div class="meta">
        <span>Native <strong id="nativeSym">—</strong></span>
        <span>Last <strong id="lastPrice">—</strong></span>
        <span>Candles <strong id="candleCount">—</strong></span>
      </div>
      <div id="chartStatus" class="status-line">Chart idle</div>
      <div id="chart" aria-label="TradeMenu chart"></div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tabPositions" data-tab="positions" role="tab" aria-selected="true">Positions</button>
        <button type="button" class="tab" id="tabOrders" data-tab="orders" role="tab" aria-selected="false">Orders</button>
        <button type="button" class="tab-refresh" id="refreshPanelBtn" title="Refresh panel">↻</button>
      </div>

      <section class="panel" id="panelPositions">
        <div class="panel-meta">
          <span id="positionsStatus" class="status-line">Positions idle</span>
          <span id="positionsUpdated" class="updated">Last updated: —</span>
        </div>
        <div class="positions">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Side</th>
                <th class="num">Size</th>
                <th class="num">Entry</th>
                <th class="num">Mark</th>
                <th class="num">PnL</th>
                <th class="num">SL</th>
                <th class="num">TP</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="positionsBody">
              <tr><td colspan="9">—</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="panelOrders" hidden>
        <div class="panel-meta">
          <span id="ordersStatus" class="status-line">Orders idle</span>
          <span id="ordersUpdated" class="updated">Last updated: —</span>
        </div>
        <div class="positions">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Side / Type</th>
                <th class="num">Orders</th>
                <th class="num">Total Volume</th>
                <th class="num">Price Range</th>
                <th class="num">VWAP</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="7">—</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h2 id="modalTitle">Action</h2>
      <p id="modalBody" class="modal-body"></p>
      <div id="modalFields" class="modal-fields" hidden>
        <label id="modalFieldLabel">New value
          <input id="modalInput" type="text" inputmode="decimal" autocomplete="off" />
        </label>
      </div>
      <p id="modalError" class="error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modalCancel">Cancel</button>
        <button type="button" class="btn-danger" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>

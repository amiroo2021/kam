<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradeMenu</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">TradeMenu</div>
      <form method="post" action="/logout"><button type="submit">Logout</button></form>
    </header>

    <section class="controls">
      <label>Exchange
        <select id="exchange"></select>
      </label>
      <label>Account
        <select id="account"></select>
      </label>
      <label>Symbol
        <input id="symbol" value="BTCUSD" list="symbolSuggestions" />
        <datalist id="symbolSuggestions"></datalist>
      </label>
      <label>TF
        <select id="tf">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m" selected>15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
          <option value="1D">1D</option>
        </select>
      </label>
      <label>&nbsp;<button type="button" id="reloadBtn">Reload</button></label>
    </section>

    <div>
      <div class="meta">
        <span>Native <strong id="nativeSym">—</strong></span>
        <span>Last <strong id="lastPrice">—</strong></span>
        <span>Candles <strong id="candleCount">—</strong></span>
      </div>
      <div id="chartStatus" class="status-line">Chart idle</div>
      <div id="chart" aria-label="TradeMenu chart"></div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tabPositions" data-tab="positions" role="tab" aria-selected="true">Positions</button>
        <button type="button" class="tab" id="tabOrders" data-tab="orders" role="tab" aria-selected="false">Orders</button>
      </div>

      <section class="panel" id="panelPositions">
        <div id="positionsStatus" class="status-line">Positions idle</div>
        <div class="positions">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Side</th>
                <th>Size</th>
                <th>Entry</th>
                <th>Mark</th>
                <th>PnL</th>
                <th>SL</th>
                <th>TP</th>
              </tr>
            </thead>
            <tbody id="positionsBody">
              <tr><td colspan="8">—</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="panelOrders" hidden>
        <div id="ordersStatus" class="status-line">Orders idle</div>
        <div class="positions">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Side / Type</th>
                <th>Orders</th>
                <th>Total Volume</th>
                <th>Price Range</th>
                <th>VWAP</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="6">—</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
